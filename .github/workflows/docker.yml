name: Build frontend image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: mtynfhymy83/front-pardis-book

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify frontend build
        shell: bash
        run: |
          set +e
          npm run build 2>&1 | tee frontend-build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E 'error TS[0-9]+' frontend-build.log | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit "$status"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test published image
        shell: bash
        run: |
          image="${{ env.IMAGE_NAME }}:sha-${GITHUB_SHA::7}"
          docker pull "$image"
          container=$(docker run --rm -d -p 127.0.0.1:8080:80 "$image")
          trap 'docker logs "$container"; docker stop "$container" >/dev/null' EXIT
          for attempt in {1..10}; do
            if curl --fail --silent http://127.0.0.1:8080/health | grep --quiet '^ok$'; then
              exit 0
            fi
            sleep 1
          done
          exit 1
